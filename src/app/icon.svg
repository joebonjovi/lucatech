<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Luca Technologies">
  <!-- Distilled from the Luca Technologies logo: house + plug mark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blue house shell (open bottom, small eaves) -->
    <path
      d="M8 28.5 L14.5 23.2 L32 9.2 L49.5 23.2 L56 28.5"
      stroke="#1C68BC"
      stroke-width="5.25"
    />
    <path d="M14.5 23.8 V54" stroke="#1C68BC" stroke-width="5.25" />
    <path d="M49.5 23.8 V42" stroke="#1C68BC" stroke-width="5.25" />

    <!-- Plug prongs -->
    <path d="M27 24.2 V30.8 M37 24.2 V30.8" stroke="#0C182C" stroke-width="3.5" />

    <!-- Plug body -->
    <rect x="22" y="30.5" width="20" height="16.5" rx="3.2" fill="#0C182C" />

    <!-- Cord curves out through the lower-right wall into a blue tip -->
    <path
      d="M32 47 C32 53.5 38.5 57 45 55.5 C49.5 54.5 52.5 51.5 54 48.5"
      stroke="#0C182C"
      stroke-width="4.25"
    />
    <!-- Navy segment completing the right wall where the cord exits -->
    <path d="M49.5 42 V54" stroke="#0C182C" stroke-width="5.25" />
    <circle cx="54.5" cy="47.2" r="3.4" fill="#1C68BC" />
  </g>
</svg>
